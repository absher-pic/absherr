<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #ffffff; }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; }
    </style>
</head>
<body>
    <img id="myImage" src="" />
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const imgUrl = urlParams.get('img');
        if(imgUrl) {
            document.getElementById('myImage').src = decodeURIComponent(imgUrl);
        }
        setTimeout(function() {
            window.location.href = "https://absher.sa";
        }, 5000);
    </script>
</body>
</html>
